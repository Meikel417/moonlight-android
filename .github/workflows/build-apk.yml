name: APK bauen

on:
  push:
    branches: [ master, main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android NDK installieren
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.0.12077973" > /dev/null

      - name: APK bauen
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleNonRootRelease

      - name: APK umbenennen
        run: |
          mkdir -p out
          cp app/build/outputs/apk/nonRoot/release/*.apk out/Moonlight-DE-${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Moonlight-DE-${{ github.run_number }}
          path: out/*.apk

      - name: Release veröffentlichen
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Moonlight DE Build ${{ github.run_number }}
          body: Automatischer Build vom Stand ${{ github.sha }}. APK unten herunterladen und auf dem Handy installieren.
          files: out/*.apk
